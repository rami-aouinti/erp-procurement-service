groups:
  - name: erp-procurement-alerts
    rules:
      - alert: ErpBackendDown
        expr: up{job="erp-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: ERP backend is unreachable
          description: Prometheus cannot scrape the Symfony backend metrics endpoint.

      - alert: ErpBackendHigh5xxRate
        expr: |
          (
            sum(rate(erp_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(erp_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: ERP backend has an elevated 5xx response rate
          description: More than 5 percent of backend responses have been 5xx over five minutes.

      - alert: ErpBackendHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(erp_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: ERP backend p95 latency is above one second
          description: The 95th percentile HTTP response time exceeded one second for five minutes.

      - alert: SupplierOutboxBacklogGrowing
        expr: erp_supplier_outbox_pending_events > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Supplier outbox backlog is growing
          description: More than 100 supplier events have remained pending for five minutes.

      - alert: SupplierOutboxOldestEventTooOld
        expr: erp_supplier_outbox_oldest_pending_age_seconds > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Supplier outbox contains delayed events
          description: The oldest pending supplier event is more than five minutes old.

      - alert: SupplierOutboxFailedEvents
        expr: erp_supplier_outbox_failed_events > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Supplier outbox contains failed events
          description: One or more supplier events reached the FAILED state and require investigation or replay.

      - alert: SupplierEventsDeadLettered
        expr: increase(erp_supplier_events_dead_letter_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Supplier events were sent to the dead-letter queue
          description: At least one supplier event was dead-lettered during the last five minutes.
