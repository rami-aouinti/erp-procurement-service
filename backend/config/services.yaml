parameters:
    empty_json: '{}'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Supplier/Domain/'
            - '../src/Supplier/Application/Exception/'
            - '../src/Supplier/Application/Port/'
            - '../src/Supplier/Application/DTO/'
            - '../src/Supplier/Infrastructure/Persistence/Doctrine/Entity/'
            - '../src/Configuration/Domain/'
            - '../src/Configuration/Application/Port/'

    App\Security\Keycloak\KeycloakJwtAuthenticator:
        arguments:
            $issuer: '%env(KEYCLOAK_ISSUER)%'
            $audience: '%env(KEYCLOAK_AUDIENCE)%'
            $jwksUrl: '%env(KEYCLOAK_JWKS_URL)%'

    App\Supplier\Application\Port\SupplierBankDataCipher:
        alias: App\Supplier\Infrastructure\Security\SupplierBankDataEncryptor

    App\Supplier\Domain\Repository\SupplierRepository:
        alias: App\Supplier\Infrastructure\Persistence\Doctrine\DoctrineSupplierRepository

    App\Supplier\Domain\Repository\SupplierProfileRepository:
        alias: App\Supplier\Infrastructure\Persistence\Doctrine\DoctrineSupplierProfileRepository

    App\Supplier\Application\Port\SupplierSearchIndex:
        alias: App\Supplier\Infrastructure\Search\ElasticsearchSupplierSearchIndex

    App\Supplier\Application\Port\SupplierListCache:
        alias: App\Supplier\Infrastructure\Cache\RedisSupplierListCache

    App\Supplier\Application\Port\SupplierClassificationReader:
        alias: App\Supplier\Infrastructure\Persistence\OracleSupplierClassificationReader

    App\Supplier\Application\Port\SupplierClassificationRepository:
        alias: App\Supplier\Infrastructure\Persistence\OracleSupplierClassificationRepository

    App\Supplier\Application\Port\SupplierDocumentStorage:
        alias: App\Supplier\Infrastructure\Storage\LocalPrivateSupplierDocumentStorage

    App\Supplier\Application\Port\SupplierDocumentMalwareScanner:
        alias: App\Supplier\Infrastructure\Scanning\ClamAvSupplierDocumentMalwareScanner

    App\Supplier\Infrastructure\Scanning\ClamAvSupplierDocumentMalwareScanner:
        arguments:
            $host: '%env(CLAMAV_HOST)%'
            $port: '%env(int:CLAMAV_PORT)%'
            $timeoutSeconds: '%env(float:CLAMAV_TIMEOUT_SECONDS)%'

    App\Supplier\Infrastructure\Storage\LocalPrivateSupplierDocumentStorage:
        arguments:
            $root: '%env(SUPPLIER_DOCUMENT_STORAGE_PATH)%'

    App\Supplier\Application\Port\SupplierEventDeduplication:
        alias: App\Supplier\Infrastructure\Persistence\OracleSupplierEventDeduplication

    App\Configuration\Domain\Repository\ConfigurationRepository:
        alias: App\Configuration\Infrastructure\Persistence\Doctrine\OracleConfigurationRepository

    App\Configuration\Domain\Repository\UserPreferenceRepository:
        alias: App\Configuration\Infrastructure\Persistence\Doctrine\OracleUserPreferenceRepository

    App\Configuration\Application\Port\ConfigurationCache:
        alias: App\Configuration\Infrastructure\Cache\RedisConfigurationCache

    App\Supplier\Application\Port\SupplierFormPolicy:
        alias: App\Configuration\Infrastructure\Supplier\ConfigurationSupplierFormPolicy

    App\Observability\MetricsRegistry:
        arguments:
            $redisHost: '%env(REDIS_HOST)%'
            $redisPort: '%env(int:REDIS_PORT)%'

    App\Supplier\Infrastructure\Cache\RedisSupplierListCache:
        arguments:
            $host: '%env(REDIS_HOST)%'
            $port: '%env(int:REDIS_PORT)%'

    App\Configuration\Infrastructure\Cache\RedisConfigurationCache:
        arguments:
            $host: '%env(REDIS_HOST)%'
            $port: '%env(int:REDIS_PORT)%'

    App\Supplier\Infrastructure\Search\ElasticsearchSupplierSearchIndex:
        arguments:
            $url: '%env(ELASTICSEARCH_URL)%'

    App\Supplier\Infrastructure\Messaging\RabbitMqSupplierEventBus:
        arguments:
            $host: '%env(RABBITMQ_HOST)%'
            $port: '%env(int:RABBITMQ_PORT)%'
            $user: '%env(RABBITMQ_USER)%'
            $password: '%env(RABBITMQ_PASSWORD)%'
            $vhost: '%env(RABBITMQ_VHOST)%'

    App\Supplier\Infrastructure\Security\SupplierBankDataEncryptor:
        arguments:
            $base64Key: '%env(SUPPLIER_BANK_ENCRYPTION_KEY)%'
            $keyVersion: '%env(SUPPLIER_BANK_ENCRYPTION_KEY_VERSION)%'
            $previousKeysJson: '%env(default:empty_json:SUPPLIER_BANK_PREVIOUS_ENCRYPTION_KEYS)%'

    Psr\Log\LoggerInterface:
        alias: App\Observability\StderrLogger
