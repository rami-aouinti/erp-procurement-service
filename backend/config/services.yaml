services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Supplier/Domain/'
            - '../src/Supplier/Application/DTO/'
            - '../src/Supplier/Infrastructure/Persistence/Doctrine/Entity/'

    App\Supplier\Domain\Repository\SupplierRepository:
        alias: App\Supplier\Infrastructure\Persistence\Doctrine\DoctrineSupplierRepository
