doctrine:
    dbal:
        driver: oci8
        host: '%env(ORACLE_HOST)%'
        port: '%env(int:ORACLE_PORT)%'
        user: '%env(ORACLE_USER)%'
        password: '%env(ORACLE_PASSWORD)%'
        servicename: '%env(ORACLE_SERVICE)%'
        charset: AL32UTF8
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
            SupplierInfrastructure:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Supplier/Infrastructure/Persistence/Doctrine/Entity'
                prefix: 'App\Supplier\Infrastructure\Persistence\Doctrine\Entity'
