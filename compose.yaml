services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: erp-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      APP_USER: ${APP_USER:-ERP_APP}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Set APP_USER_PASSWORD in .env}
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: erp-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 60s

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: erp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-erp_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: /erp
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    working_dir: /app
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-local-development-secret-change-me}
      SUPPLIER_BANK_ENCRYPTION_KEY: ${SUPPLIER_BANK_ENCRYPTION_KEY:?Set SUPPLIER_BANK_ENCRYPTION_KEY in .env}
      SUPPLIER_BANK_ENCRYPTION_KEY_VERSION: ${SUPPLIER_BANK_ENCRYPTION_KEY_VERSION:-v1}
      DEFAULT_URI: http://localhost
      ORACLE_HOST: oracle
      ORACLE_PORT: 1521
      ORACLE_SERVICE: FREEPDB1
      ORACLE_USER: ${APP_USER:-ERP_APP}
      ORACLE_PASSWORD: ${APP_USER_PASSWORD:?Set APP_USER_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: /erp
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  supplier-outbox-publisher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-supplier-outbox-publisher
    working_dir: /app
    restart: unless-stopped
    command: ["sh", "-lc", "until [ -f vendor/autoload.php ]; do sleep 2; done; while true; do php bin/console supplier:outbox:publish --limit=100 || true; sleep 2; done"]
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-local-development-secret-change-me}
      ORACLE_HOST: oracle
      ORACLE_PORT: 1521
      ORACLE_SERVICE: FREEPDB1
      ORACLE_USER: ${APP_USER:-ERP_APP}
      ORACLE_PASSWORD: ${APP_USER_PASSWORD:?Set APP_USER_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: /erp
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  supplier-events-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-supplier-events-consumer
    working_dir: /app
    restart: unless-stopped
    command: ["sh", "-lc", "until [ -f vendor/autoload.php ]; do sleep 2; done; php bin/console supplier:events:consume"]
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-local-development-secret-change-me}
      ORACLE_HOST: oracle
      ORACLE_PORT: 1521
      ORACLE_SERVICE: FREEPDB1
      ORACLE_USER: ${APP_USER:-ERP_APP}
      ORACLE_PASSWORD: ${APP_USER_PASSWORD:?Set APP_USER_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: /erp
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: erp-cloudbeaver
    restart: unless-stopped
    ports:
      - "127.0.0.1:8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      oracle:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: erp-frontend
    working_dir: /app
    restart: unless-stopped
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  oracle_data:
    name: erp_oracle_data
  cloudbeaver_data:
    name: erp_cloudbeaver_data
  redis_data:
    name: erp_redis_data
  elasticsearch_data:
    name: erp_elasticsearch_data
  rabbitmq_data:
    name: erp_rabbitmq_data
