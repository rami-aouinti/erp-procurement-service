services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: erp-oracle
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?Set ORACLE_PASSWORD in .env}
      APP_USER: ${APP_USER:-ERP_APP}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?Set APP_USER_PASSWORD in .env}
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: erp-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 60s

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: erp-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-erp_app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: /erp
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-backend
    working_dir: /app
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-local-development-secret-change-me}
      SUPPLIER_BANK_ENCRYPTION_KEY: ${SUPPLIER_BANK_ENCRYPTION_KEY:-}
      SUPPLIER_BANK_ENCRYPTION_KEY_VERSION: ${SUPPLIER_BANK_ENCRYPTION_KEY_VERSION:-v1}
      DEFAULT_URI: http://localhost
      ORACLE_HOST: oracle
      ORACLE_PORT: 1521
      ORACLE_SERVICE: FREEPDB1
      ORACLE_USER: ${APP_USER:-ERP_APP}
      ORACLE_PASSWORD: ${APP_USER_PASSWORD:?Set APP_USER_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: /erp
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  supplier-outbox-publisher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-supplier-outbox-publisher
    working_dir: /app
    restart: unless-stopped
    command: ["sh", "-lc", "until [ -f vendor/autoload.php ]; do sleep 2; done; while true; do php bin/console supplier:outbox:publish --limit=100 || true; sleep 2; done"]
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-local-development-secret-change-me}
      ORACLE_HOST: oracle
      ORACLE_PORT: 1521
      ORACLE_SERVICE: FREEPDB1
      ORACLE_USER: ${APP_USER:-ERP_APP}
      ORACLE_PASSWORD: ${APP_USER_PASSWORD:?Set APP_USER_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: /erp
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  supplier-events-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-supplier-events-consumer
    working_dir: /app
    restart: unless-stopped
    command: ["sh", "-lc", "until [ -f vendor/autoload.php ]; do sleep 2; done; php bin/console supplier:events:consume"]
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-local-development-secret-change-me}
      ORACLE_HOST: oracle
      ORACLE_PORT: 1521
      ORACLE_SERVICE: FREEPDB1
      ORACLE_USER: ${APP_USER:-ERP_APP}
      ORACLE_PASSWORD: ${APP_USER_PASSWORD:?Set APP_USER_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-erp_app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_VHOST: /erp
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_started
      oracle:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: erp-cloudbeaver
    restart: unless-stopped
    ports:
      - "127.0.0.1:8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      oracle:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: erp-frontend
    working_dir: /app
    restart: unless-stopped
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: erp-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
      - cadvisor
      - node-exporter

  grafana:
    image: grafana/grafana:11.5.2
    container_name: erp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: erp-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    ports:
      - "127.0.0.1:8088:8080"

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: erp-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"

  k6:
    image: grafana/k6:0.57.0
    container_name: erp-k6
    profiles: ["loadtest"]
    working_dir: /scripts
    volumes:
      - ./k6:/scripts:ro
    environment:
      BASE_URL: http://backend:8000
    command: ["run", "/scripts/health.js"]
    depends_on:
      - backend

volumes:
  oracle_data:
    name: erp_oracle_data
  cloudbeaver_data:
    name: erp_cloudbeaver_data
  redis_data:
    name: erp_redis_data
  elasticsearch_data:
    name: erp_elasticsearch_data
  rabbitmq_data:
    name: erp_rabbitmq_data
  prometheus_data:
    name: erp_prometheus_data
  grafana_data:
    name: erp_grafana_data
