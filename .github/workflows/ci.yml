name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supplier-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and PHP quality gates
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env:
          ORACLE_PASSWORD: OracleRootPassword123
          APP_USER: ERP_APP
          APP_USER_PASSWORD: ErpAppPassword123
        ports:
          - 1521:1521
        options: >-
          --health-cmd "healthcheck.sh"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"
          --health-interval 10s
          --health-timeout 8s
          --health-retries 30
          --health-start-period 60s
      rabbitmq:
        image: rabbitmq:4.0-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: erp_app
          RABBITMQ_DEFAULT_PASS: ErpRabbitPassword123
          RABBITMQ_DEFAULT_VHOST: /erp
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Oracle schema and fixtures
        env:
          ORACLE_CONTAINER_ID: ${{ job.services.oracle.id }}
        run: |
          docker cp database/oracle/. "$ORACLE_CONTAINER_ID:/tmp/oracle-init"
          docker exec "$ORACLE_CONTAINER_ID" bash -lc '
            set -e
            sqlplus -s ERP_APP/ErpAppPassword123@//localhost:1521/FREEPDB1 @/tmp/oracle-init/001_create_procurement_schema.sql
            sqlplus -s ERP_APP/ErpAppPassword123@//localhost:1521/FREEPDB1 @/tmp/oracle-init/002_seed_procurement_data.sql
            sqlplus -s ERP_APP/ErpAppPassword123@//localhost:1521/FREEPDB1 @/tmp/oracle-init/004_create_goods_receiving.sql
            sqlplus -s ERP_APP/ErpAppPassword123@//localhost:1521/FREEPDB1 @/tmp/oracle-init/006_create_suppliers_sequence.sql
            sqlplus -s ERP_APP/ErpAppPassword123@//localhost:1521/FREEPDB1 @/tmp/oracle-init/007_extend_supplier_management.sql
            sqlplus -s ERP_APP/ErpAppPassword123@//localhost:1521/FREEPDB1 @/tmp/oracle-init/008_create_supplier_outbox.sql
          '

      - name: Build backend image (PHP 8.4 + OCI8 + Redis + AMQP)
        run: docker build --tag erp-procurement-backend:ci ./backend

      - name: Install application and tooling dependencies, run tests and quality checks
        run: |
          docker run --rm --network host \
            --volume "${{ github.workspace }}/backend:/app" \
            --workdir /app \
            --env APP_ENV=test \
            --env APP_DEBUG=1 \
            --env APP_SECRET=ci-only-secret \
            --env DEFAULT_URI=http://localhost \
            --env ORACLE_HOST=127.0.0.1 \
            --env ORACLE_PORT=1521 \
            --env ORACLE_SERVICE=FREEPDB1 \
            --env ORACLE_USER=ERP_APP \
            --env ORACLE_PASSWORD=ErpAppPassword123 \
            --env REDIS_HOST=127.0.0.1 \
            --env REDIS_PORT=6379 \
            --env ELASTICSEARCH_URL=http://127.0.0.1:9200 \
            --env RABBITMQ_HOST=127.0.0.1 \
            --env RABBITMQ_PORT=5672 \
            --env RABBITMQ_USER=erp_app \
            --env RABBITMQ_PASSWORD=ErpRabbitPassword123 \
            --env RABBITMQ_VHOST=/erp \
            erp-procurement-backend:ci \
            sh -lc '
              set -e
              composer install --no-interaction --prefer-dist
              composer update --working-dir=tooling --no-interaction --prefer-dist
              php bin/console supplier:reindex --env=test
              composer test

              php bin/console supplier:events:consume --env=test > /tmp/supplier-consumer.log 2>&1 &
              CONSUMER_PID=$!
              (
                while true; do
                  php bin/console supplier:outbox:publish --limit=100 --env=test || true
                  sleep 2
                done
              ) > /tmp/supplier-publisher.log 2>&1 &
              PUBLISHER_PID=$!
              trap "kill $CONSUMER_PID $PUBLISHER_PID 2>/dev/null || true" EXIT

              composer test:integration
              composer --working-dir=tooling phpcs
              composer --working-dir=tooling ecs
              composer --working-dir=tooling phpmd
              composer --working-dir=tooling phpstan
              composer --working-dir=tooling rector
              composer --working-dir=tooling insights
            '

  frontend:
    name: Build React frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  monitoring:
    name: Validate monitoring configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm \
            --volume "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint=promtool prom/prometheus:v3.2.1 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --volume "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint=promtool prom/prometheus:v3.2.1 \
            check rules /etc/prometheus/alerts.yml
      - name: Validate Loki configuration
        run: |
          docker run --rm \
            --volume "$PWD/monitoring/loki:/etc/loki:ro" \
            grafana/loki:3.4.2 \
            -config.file=/etc/loki/loki.yaml -verify-config=true
      - name: Validate Grafana dashboard JSON
        run: python -m json.tool monitoring/grafana/dashboards/erp-overview.json > /dev/null
